version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sentrix_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${SENTRIX_SERVER_IMAGE:-ghcr.io/your-org/sentrix-server:v0.6.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      SENTRIX_PUBLIC_URL: ${SENTRIX_PUBLIC_URL}
      SENTRIX_MIGRATIONS_DIR: /app/migrations
      SENTRIX_WEB_DIR: /app/web
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sentrix_data:
