version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sentrix-db
    environment:
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix_secret
      POSTGRES_DB: sentrix
    ports:
      - "5432:5432"
    volumes:
      - sentrix_data:/var/lib/postgresql/data
      - ../../server/migrations:/docker-entrypoint-initdb.d # Auto-run migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sentrix_data:
